# Enforce engine versions in package.json
engineStrict: true

# Enable save-exact
savePrefix: ''

# Delays the installation of newly published versions (minutes)
minimumReleaseAge: 10080

# Rejects versions that downgrade authentication evidence
trustPolicy: no-downgrade

# Applies the trust policy only to recently published versions (minutes)
trustPolicyIgnoreAfter: 10080

# Dependencies allowed to run install scripts
allowBuilds:
  sharp: true
